<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nakup">
<title>Seznam za nakup</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #1a1814;
    --text2: #6b6560;
    --text3: #a09890;
    --accent: #3d7a4f;
    --accent-light: #e8f2ec;
    --accent-dark: #2a5636;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: 90px; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 18px 20px 14px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .app-title { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.3px; }
  .header-stats { font-size: 13px; color: var(--text3); }
  .tab-bar { display: flex; gap: 6px; }
  .tab { flex: 1; padding: 9px 8px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.15s; text-align: center; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .view { padding: 16px 16px 0; display: none; }
  .view.active { display: block; }
  .mode-banner { background: var(--accent-light); border: 1px solid rgba(61,122,79,0.2); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: var(--accent-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .cat-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); padding: 0 4px 8px; margin-top: 8px; }
  .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; overflow: hidden; }
  .item-row { display: flex; align-items: center; padding: 13px 14px; gap: 12px; user-select: none; }
  .item-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: var(--surface); cursor: pointer; }
  .item-check svg { display: none; }
  .item-row.checked .item-check { background: var(--accent); border-color: var(--accent); }
  .item-row.checked .item-check svg { display: block; }
  .item-name { flex: 1; font-size: 15px; color: var(--text); cursor: pointer; }
  .item-row.checked .item-name { text-decoration: line-through; color: var(--text3); }
  .drag-handle { color: var(--text3); cursor: grab; padding: 0 4px; font-size: 20px; line-height: 1; touch-action: none; flex-shrink: 0; }
  input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid var(--border2); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 15px; background: var(--surface); color: var(--text); outline: none; -webkit-appearance: none; margin-bottom: 8px; }
  input[type="text"]:focus { border-color: var(--accent); }
  select { padding: 12px 10px; border: 1px solid var(--border2); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--surface); color: var(--text); outline: none; -webkit-appearance: none; appearance: none; flex: 1; }
  .btn { padding: 12px 16px; border: 1px solid var(--border2); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; background: var(--surface); color: var(--text); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-share { color: var(--accent); border-color: rgba(61,122,79,0.3); }
  .btn-danger { color: var(--danger); border-color: rgba(192,57,43,0.25); }
  .seznam-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; display: flex; align-items: center; padding: 12px 14px; gap: 10px; transition: all 0.15s; }
  .seznam-item.dragging { opacity: 0.4; border: 2px dashed var(--accent); }
  .seznam-item.drag-over { border: 2px solid var(--accent); background: var(--accent-light); }
  .seznam-item-name { flex: 1; font-size: 15px; color: var(--text); }
  .del-btn { padding: 4px 8px; background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 20px; line-height: 1; border-radius: 6px; }
  .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; display: none; gap: 8px; }
  .bottom-bar.active { display: flex; }
  .bottom-bar .btn { flex: 1; text-align: center; font-size: 13px; padding: 10px 6px; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text3); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; line-height: 1.5; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 14px; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="app-title">Nakupni seznam</div>
    <div class="header-stats" id="headerStats"></div>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showView('nakup')" id="tab-nakup">🛒 Nakup</button>
    <button class="tab" onclick="showView('kosarica')" id="tab-kosarica">✅ Izbrano</button>
    <button class="tab" onclick="showView('seznam')" id="tab-seznam">📋 Urejanje</button>
  </div>
</header>

<div id="view-nakup" class="view active">
  <div class="mode-banner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Označi kar že imaš v košarici
  </div>
  <div id="nakupList"></div>
  <div id="nakupEmpty" class="empty-state" style="display:none;">
    <div class="icon">🌿</div>
    <p>Seznam je prazen.<br>Dodaj artikle v zavihku <strong>Urejanje</strong>.</p>
  </div>
</div>

<div id="view-kosarica" class="view">
  <div class="mode-banner" style="background:#fff8e6; border-color:rgba(180,130,0,0.2); color:#7a5800;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    Označeni artikli — že v košarici
  </div>
  <div id="kosaricaList"></div>
  <div id="kosaricaEmpty" class="empty-state">
    <div class="icon">🧺</div>
    <p>Košarica je prazna.<br>Označi artikle v zavihku <strong>Nakup</strong>.</p>
  </div>
</div>

<div id="view-seznam" class="view">
  <div style="margin-bottom:16px;">
    <input type="text" id="newItemInput" placeholder="Nov artikel..." onkeydown="if(event.key==='Enter')addItem()" />
    <div style="display:flex; gap:8px;">
      <select id="newItemCat">
        <option value="Sadje">🍎 Sadje</option>
        <option value="Zelenjava">🥦 Zelenjava</option>
        <option value="Jajca in mlečni">🥛 Jajca in mlečni</option>
        <option value="Pekarna">🍞 Pekarna</option>
        <option value="Suha živila">🫘 Suha živila</option>
        <option value="Zamrznjeno">❄️ Zamrznjeno</option>
        <option value="Začimbe in omake">🧂 Začimbe in omake</option>
        <option value="Pijače">🧃 Pijače</option>
        <option value="Sladkarije">🍫 Sladkarije</option>
        <option value="Osebna nega">🧴 Osebna nega</option>
        <option value="Čistila">🧹 Čistila</option>
        <option value="Ostalo">📦 Ostalo</option>
      </select>
      <button class="btn btn-accent" onclick="addItem()" style="white-space:nowrap;">+ Dodaj</button>
    </div>
  </div>
  <p style="font-size:12px; color:var(--text3); margin-bottom:12px; padding-left:4px;">Drži ≡ in povleci za premikanje artiklov</p>
  <div id="seznamList"></div>
  <div id="seznamEmpty" class="empty-state" style="display:none;">
    <div class="icon">✏️</div>
    <p>Še ni artiklov.</p>
  </div>
</div>

<div class="bottom-bar active" id="bottomBar-nakup">
  <button class="btn" onclick="odznaci()">Počisti kljukice</button>
  <button class="btn btn-accent" onclick="pocistiKupljene()">✓ Počisti</button>
</div>
<div class="bottom-bar" id="bottomBar-kosarica">
  <button class="btn" onclick="odznaci()">Počisti kljukice</button>
  <button class="btn btn-share" onclick="deliSeznam()">📤 Deli</button>
  <button class="btn btn-accent" onclick="pocistiKupljene()">✓ Počisti</button>
</div>
<div class="bottom-bar" id="bottomBar-seznam">
  <button class="btn btn-danger" onclick="izbrisiVse()">Izbriši vse</button>
  <button class="btn btn-accent" onclick="showView('nakup')">Na nakup →</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = ["Sadje","Zelenjava","Jajca in mlečni","Pekarna","Suha živila","Zamrznjeno","Začimbe in omake","Pijače","Sladkarije","Osebna nega","Čistila","Ostalo"];

const DEFAULT_ITEMS = [
  {cat:"Sadje", items:["Banane","Jabolka","Pomaranče","Limona","Limeta","Jagode","Maline","Borovnice","Grozdje","Hruške","Breskve","Slive","Kivi","Mango","Ananas","Melona","Lubenica","Avokado","Datlji","Rozine"]},
  {cat:"Zelenjava", items:["Paradižnik","Kumare","Paprika","Čebula","Česen","Solata","Špinača","Rukola","Brokoli","Cvetača","Korenje","Tikvice","Buča","Beluši","Por","Koleraba","Zelje","Rdeča pesa","Redkvice","Zelena","Krompir","Sladki krompir","Gobe","Artičoke","Feferoni","Jajčevci"]},
  {cat:"Jajca in mlečni", items:["Jajca","Mleko","Rastlinsko mleko","Jogurt","Grški jogurt","Sir (trdi)","Sir (mehki)","Mozzarella","Feta sir","Maslo","Skuta","Kisla smetana","Sladka smetana","Kremni sir","Parmezan"]},
  {cat:"Pekarna", items:["Kruh","Žemlje","Polnozrnat kruh","Baguette","Pita kruh","Tortilije","Prepečenec","Ovseni kosmiči","Muesli","Granola"]},
  {cat:"Suha živila", items:["Testenine","Špageti","Riž","Rjavi riž","Kvinoja","Ječmen","Proso","Leča (rdeča)","Leča (zelena)","Čičerika","Fižol (beli)","Fižol (rdeči)","Konzerva paradižnikov","Kokosovo mleko","Olivno olje","Sončnično olje","Kis","Sojina omaka","Tahini","Arašidovo maslo","Med","Javorjev sirup","Orehi","Mandlji","Indijski oreščki","Lešniki","Bučna semena","Sezam","Lanena semena","Chia semena","Čokolada (temna)","Kakav"]},
  {cat:"Zamrznjeno", items:["Zamrznjen grah","Zamrznjena koruza","Zamrznjena špinača","Zamrznjen brokoli","Zamrznjene jagode","Tofu","Edamame"]},
  {cat:"Začimbe in omake", items:["Sol","Poper","Kurkuma","Kumina","Koriander","Paprika v prahu","Cimet","Muškatni orešček","Lovorov list","Timijan","Rožmarin","Bazilika","Origano","Curry v prahu","Čili v prahu","Ingver (svež)","Gorčica","Kečap","Tabasco","Jušna osnova"]},
  {cat:"Pijače", items:["Voda","Mineralna voda","Sok (pomaranča)","Sok (jabolko)","Zeliščni čaj","Zeleni čaj","Kava","Kakav v prahu","Vino (rdeče)","Vino (belo)","Pivo"]},
  {cat:"Sladkarije", items:["Temna čokolada","Sladoled","Piškoti"]},
  {cat:"Osebna nega", items:["Šampon","Balzam za lase","Gel za tuširanje","Milo","Zobna pasta","Zobna ščetka","Nitka za zobe","Dezodorant","Krema za obraz","Krema za telo","Tamponi","Vložki"]},
  {cat:"Čistila", items:["Detergent za pomivanje","Detergent za pranje","Mehčalec","Čistilo za kopalnico","Čistilo za WC","Čistilo za kuhinjske površine","Toaletni papir","Papirnate brisačke","Kuhinjske krpe","Aluminijasta folija","Pečica papir","Vrečke za smeti","Gobica"]},
  {cat:"Ostalo", items:["Baterije","Sveče","Vžigalice","Žarnice","Vrečke za zamrzovalnik"]}
];

function loadItems() {
  try {
    const saved = localStorage.getItem('nakup-v3');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  const items = [];
  DEFAULT_ITEMS.forEach(g => g.items.forEach(name => items.push({name, cat:g.cat, checked:false})));
  return items;
}

let items = loadItems();

function save() {
  try { localStorage.setItem('nakup-v3', JSON.stringify(items)); } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.bottom-bar').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.getElementById('bottomBar-' + v).classList.add('active');
  document.getElementById('tab-' + v).classList.add('active');
  if (v==='nakup') renderNakup();
  else if (v==='kosarica') renderKosarica();
  else renderSeznam();
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderNakup() {
  const container = document.getElementById('nakupList');
  const empty = document.getElementById('nakupEmpty');
  container.innerHTML = '';
  if (!items.length) { empty.style.display='block'; return; }
  empty.style.display='none';
  const checked = items.filter(i=>i.checked).length;
  document.getElementById('headerStats').textContent = checked > 0 ? `${checked}/${items.length} v košarici` : `${items.length} artiklov`;
  CATEGORIES.forEach(cat => {
    const catItems = items.filter(i=>i.cat===cat);
    if (!catItems.length) return;
    const hdr = document.createElement('div');
    hdr.className = 'cat-title';
    hdr.textContent = cat;
    container.appendChild(hdr);
    catItems.forEach(item => {
      const idx = items.indexOf(item);
      const card = document.createElement('div');
      card.className = 'item-card';
      const row = document.createElement('div');
      row.className = 'item-row' + (item.checked?' checked':'');
      row.innerHTML = `
        <div class="item-check" onclick="toggleItem(${idx})">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="item-name" onclick="toggleItem(${idx})">${escHtml(item.name)}</div>
      `;
      card.appendChild(row);
      container.appendChild(card);
    });
  });
}

function renderKosarica() {
  const container = document.getElementById('kosaricaList');
  const empty = document.getElementById('kosaricaEmpty');
  container.innerHTML = '';
  const checked = items.filter(i=>i.checked);
  if (!checked.length) { empty.style.display='block'; return; }
  empty.style.display='none';
  document.getElementById('headerStats').textContent = `${checked.length} v košarici`;
  CATEGORIES.forEach(cat => {
    const catItems = checked.filter(i=>i.cat===cat);
    if (!catItems.length) return;
    const hdr = document.createElement('div');
    hdr.className = 'cat-title';
    hdr.textContent = cat;
    container.appendChild(hdr);
    catItems.forEach(item => {
      const idx = items.indexOf(item);
      const card = document.createElement('div');
      card.className = 'item-card';
      const row = document.createElement('div');
      row.className = 'item-row checked';
      row.innerHTML = `
        <div class="item-check" style="background:var(--accent);border-color:var(--accent);" onclick="items[${idx}].checked=false;save();renderKosarica();">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="item-name" style="text-decoration:none;color:var(--text);">${escHtml(item.name)}</div>
      `;
      card.appendChild(row);
      container.appendChild(card);
    });
  });
}

function renderSeznam() {
  const container = document.getElementById('seznamList');
  const empty = document.getElementById('seznamEmpty');
  container.innerHTML = '';
  if (!items.length) { empty.style.display='block'; return; }
  empty.style.display='none';
  document.getElementById('headerStats').textContent = `${items.length} artiklov`;
  CATEGORIES.forEach(cat => {
    const catItems = items.map((item,idx)=>({item,idx})).filter(({item})=>item.cat===cat);
    if (!catItems.length) return;
    const hdr = document.createElement('div');
    hdr.className = 'cat-title';
    hdr.textContent = cat;
    container.appendChild(hdr);
    catItems.forEach(({item,idx}) => {
      const row = document.createElement('div');
      row.className = 'seznam-item';
      row.draggable = true;
      row.dataset.idx = idx;
      row.innerHTML = `
        <span class="drag-handle">≡</span>
        <div class="seznam-item-name">${escHtml(item.name)}</div>
        <button class="del-btn" onclick="deleteItem(${idx})">×</button>
      `;
      setupDrag(row);
      container.appendChild(row);
    });
  });
}

let dragSrcIdx = null;

function setupDrag(el) {
  el.addEventListener('dragstart', e => {
    dragSrcIdx = parseInt(el.dataset.idx);
    setTimeout(()=>el.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(e=>e.classList.remove('drag-over'));
  });
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    const targetIdx = parseInt(el.dataset.idx);
    if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
    const moved = items.splice(dragSrcIdx, 1)[0];
    items.splice(targetIdx, 0, moved);
    save(); renderSeznam();
  });

  // Touch support
  let touchStartY = 0, touchEl = null;
  const handle = el.querySelector('.drag-handle');
  handle.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
    touchEl = el;
    dragSrcIdx = parseInt(el.dataset.idx);
    el.classList.add('dragging');
  }, {passive:true});
  handle.addEventListener('touchmove', e => {
    if (!touchEl) return;
    e.preventDefault();
    const y = e.touches[0].clientY;
    document.querySelectorAll('.seznam-item').forEach(other => {
      const rect = other.getBoundingClientRect();
      if (y >= rect.top && y <= rect.bottom && other !== touchEl) {
        document.querySelectorAll('.drag-over').forEach(e=>e.classList.remove('drag-over'));
        other.classList.add('drag-over');
      }
    });
  }, {passive:false});
  handle.addEventListener('touchend', () => {
    if (!touchEl) return;
    const over = document.querySelector('.seznam-item.drag-over');
    if (over && dragSrcIdx !== null) {
      const targetIdx = parseInt(over.dataset.idx);
      if (dragSrcIdx !== targetIdx) {
        const moved = items.splice(dragSrcIdx, 1)[0];
        items.splice(targetIdx, 0, moved);
        save();
      }
    }
    document.querySelectorAll('.drag-over').forEach(e=>e.classList.remove('drag-over'));
    touchEl.classList.remove('dragging');
    touchEl = null; dragSrcIdx = null;
    renderSeznam();
  });
}

function toggleItem(idx) { items[idx].checked = !items[idx].checked; save(); renderNakup(); }

function addItem() {
  const inp = document.getElementById('newItemInput');
  const cat = document.getElementById('newItemCat').value;
  const name = inp.value.trim();
  if (!name) return;
  if (items.some(i=>i.name.toLowerCase()===name.toLowerCase())) { showToast('Ta artikel že obstaja'); return; }
  const firstInCat = items.findIndex(i=>i.cat===cat);
  if (firstInCat >= 0) items.splice(firstInCat, 0, {name, cat, checked:false});
  else items.unshift({name, cat, checked:false});
  inp.value = '';
  save(); renderSeznam();
  showToast('Dodano: ' + name);
}

function deleteItem(idx) {
  const name = items[idx].name;
  items.splice(idx,1);
  save(); renderSeznam();
  showToast('Odstranjeno: ' + name);
}

function odznaci() {
  items.forEach(i=>i.checked=false);
  save();
  const v = document.querySelector('.tab.active').id.replace('tab-','');
  if (v==='nakup') renderNakup(); else renderKosarica();
  showToast('Kljukice počiščene');
}

function pocistiKupljene() {
  const n = items.filter(i=>i.checked).length;
  if (!n) { showToast('Ni označenih artiklov'); return; }
  items.forEach(i=>i.checked=false);
  save();
  const v = document.querySelector('.tab.active').id.replace('tab-','');
  if (v==='nakup') renderNakup(); else renderKosarica();
  showToast(`Počiščeno ${n} kljukic`);
}

function deliSeznam() {
  const checked = items.filter(i=>i.checked);
  if (!checked.length) { showToast('Ni označenih artiklov'); return; }
  let tekst = '🛒 Nakupni seznam:\n\n';
  CATEGORIES.forEach(cat => {
    const catItems = checked.filter(i=>i.cat===cat);
    if (!catItems.length) return;
    tekst += cat + ':\n';
    catItems.forEach(i => tekst += '  • ' + i.name + '\n');
    tekst += '\n';
  });
  if (navigator.share) navigator.share({title:'Nakupni seznam', text:tekst});
  else navigator.clipboard.writeText(tekst).then(()=>showToast('Seznam kopiran!'));
}

function izbrisiVse() {
  if (!confirm('Res izbrisati vse artikle?')) return;
  items = []; save(); renderSeznam();
}

renderNakup();
</script>
</body>
</html>
