<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nakup">
<title>Seznam za nakup</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --text: #1a1814;
    --text2: #6b6560;
    --text3: #a09890;
    --accent: #3d7a4f;
    --accent-light: #e8f2ec;
    --accent-dark: #2a5636;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 90px;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .app-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .header-stats {
    font-size: 13px;
    color: var(--text3);
  }

  .tab-bar {
    display: flex;
    gap: 6px;
  }

  .tab {
    flex: 1;
    padding: 9px 8px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* NAKUP VIEW */
  #view-nakup { padding: 16px 16px 0; }

  .mode-banner {
    background: var(--accent-light);
    border: 1px solid rgba(61,122,79,0.2);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--accent-dark);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mode-banner svg { flex-shrink: 0; }

  .cat-section { margin-bottom: 20px; }

  .cat-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 0 4px 8px;
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 6px;
    overflow: hidden;
    transition: opacity 0.2s;
  }

  .item-row {
    display: flex;
    align-items: center;
    padding: 13px 14px;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }

  .item-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    background: var(--surface);
  }

  .item-check svg { display: none; }

  .item-row.checked .item-check {
    background: var(--accent);
    border-color: var(--accent);
  }

  .item-row.checked .item-check svg { display: block; }

  .item-name {
    flex: 1;
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    transition: all 0.15s;
  }

  .item-row.checked .item-name {
    text-decoration: line-through;
    color: var(--text3);
  }

  .item-card.hidden { display: none; }

  .empty-cat { display: none; }

  /* SEZNAM VIEW */
  #view-seznam { padding: 16px; }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
  }

  input[type="text"]:focus { border-color: var(--accent); }

  select {
    padding: 12px 10px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    max-width: 110px;
  }

  .btn {
    padding: 12px 16px;
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-danger { color: var(--danger); border-color: rgba(192,57,43,0.25); }

  .seznam-cat { margin-bottom: 20px; }

  .seznam-cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 8px;
  }

  .seznam-cat-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .seznam-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    padding: 12px 14px;
    gap: 10px;
  }

  .seznam-item-name {
    flex: 1;
    font-size: 15px;
    color: var(--text);
  }

  .del-btn {
    padding: 4px 8px;
    background: transparent;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    border-radius: 6px;
    transition: all 0.15s;
  }

  .del-btn:active { color: var(--danger); background: var(--danger-light); }

  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 8px;
  }

  .bottom-bar .btn { flex: 1; text-align: center; font-size: 13px; padding: 10px; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text3);
  }

  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; line-height: 1.5; }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .count-badge {
    background: var(--accent);
    color: #fff;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    margin-left: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="app-title">Nakupni seznam</div>
    <div class="header-stats" id="headerStats"></div>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showView('nakup')" id="tab-nakup">🛒 Nakup</button>
    <button class="tab" onclick="showView('kosarica')" id="tab-kosarica">✅ Izbrano</button>
    <button class="tab" onclick="showView('seznam')" id="tab-seznam">📋 Urejanje</button>
  </div>
</header>

<!-- NAKUP VIEW -->
<div id="view-nakup">
  <div class="mode-banner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    Označi kar že imaš v košarici
  </div>
  <div id="nakupList"></div>
  <div id="nakupEmpty" class="empty-state" style="display:none;">
    <div class="icon">🌿</div>
    <p>Tvoj seznam je prazen.<br>Dodaj artikle v zavihku <strong>Urejanje</strong>.</p>
  </div>
</div>

<!-- KOŠARICA VIEW -->
<div id="view-kosarica" style="display:none; padding:16px 16px 0;">
  <div class="mode-banner" style="background:#fff8e6; border-color:rgba(180,130,0,0.2); color:#7a5800;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    Označeni artikli — že v košarici
  </div>
  <div id="kosaricaList"></div>
  <div id="kosaricaEmpty" class="empty-state">
    <div class="icon">🧺</div>
    <p>Košarica je prazna.<br>Označi artikle v zavihku <strong>Nakup</strong>.</p>
  </div>
</div>

<!-- SEZNAM VIEW -->
<div id="view-seznam" style="display:none;">
  <div style="margin-bottom:20px;">
    <input type="text" id="newItemInput" placeholder="Nov artikel..." onkeydown="if(event.key==='Enter')addItem()" style="width:100%; margin-bottom:8px;" />
    <div style="display:flex; gap:8px;">
      <select id="newItemCat" style="flex:1; max-width:none;">
        <option value="Sadje in zelenjava">🥦 Sadje in zelenjava</option>
        <option value="Jajca in mlečni">🥛 Jajca in mlečni</option>
        <option value="Pekarna">🍞 Pekarna</option>
        <option value="Suha živila">🫘 Suha živila</option>
        <option value="Pijače">🧃 Pijače</option>
        <option value="Osebna nega">🧴 Osebna nega</option>
        <option value="Čistila">🧹 Čistila</option>
        <option value="Ostalo">📦 Ostalo</option>
      </select>
      <button class="btn btn-accent" onclick="addItem()" style="white-space:nowrap;">+ Dodaj</button>
    </div>
  </div>

  <div id="seznamList"></div>

  <div id="seznamEmpty" class="empty-state" style="display:none;">
    <div class="icon">✏️</div>
    <p>Še ni artiklov.<br>Dodaj jih zgoraj!</p>
  </div>
</div>

<div class="bottom-bar" id="bottomBar-nakup">
  <button class="btn" onclick="odznaci()">Počisti kljukice</button>
  <button class="btn btn-accent" onclick="odstraniKupljene()">Odstrani kupljene</button>
</div>

<div class="bottom-bar" id="bottomBar-kosarica" style="display:none;">
  <button class="btn" onclick="odznaci()">Počisti kljukice</button>
  <button class="btn btn-accent" onclick="odstraniKupljene()">Odstrani kupljene</button>
</div>

<div class="bottom-bar" id="bottomBar-seznam" style="display:none;">
  <button class="btn btn-danger" onclick="izbrisiVse()">Izbriši vse</button>
  <button class="btn btn-accent" onclick="showView('nakup')">Na nakup →</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  "Sadje in zelenjava",
  "Jajca in mlečni",
  "Pekarna",
  "Suha živila",
  "Pijače",
  "Osebna nega",
  "Čistila",
  "Ostalo"
];

const DEFAULT_ITEMS = [
  {cat:"Sadje in zelenjava", items:["Banane","Jabolka","Pomaranče","Limona","Paradižnik","Kumare","Paprika","Čebula","Česen","Solata","Špinača","Brokoli","Korenje","Tikvice"]},
  {cat:"Jajca in mlečni", items:["Jajca","Mleko","Jogurt","Sir","Maslo","Skuta","Kisla smetana"]},
  {cat:"Pekarna", items:["Kruh","Žemlje","Ovseni kosmiči"]},
  {cat:"Suha živila", items:["Testenine","Riž","Leča","Čičerika","Fižol","Olivno olje","Sojina omaka","Oreščki","Semena","Tofu","Konzerva paradižnikov","Med","Kava","Čaj"]},
  {cat:"Pijače", items:["Voda","Sok","Vino"]},
  {cat:"Osebna nega", items:["Šampon","Balzam","Gel za tuširanje","Zobna pasta","Dezodorant","Krema za obraz","Tamponi/vložki"]},
  {cat:"Čistila", items:["Detergent za pomivanje","Detergent za pranje","Čistilo za kopalnico","Toaletni papir","Kuhinjske brisačke","Vrečke za smeti"]}
];

function loadItems() {
  try {
    const saved = localStorage.getItem('nakup-items-v2');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  const items = [];
  DEFAULT_ITEMS.forEach(g => g.items.forEach(name => items.push({name, cat:g.cat, checked:false})));
  return items;
}

let items = loadItems();

function save() {
  try { localStorage.setItem('nakup-items-v2', JSON.stringify(items)); } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function showView(v) {
  document.getElementById('view-nakup').style.display = v==='nakup' ? 'block' : 'none';
  document.getElementById('view-kosarica').style.display = v==='kosarica' ? 'block' : 'none';
  document.getElementById('view-seznam').style.display = v==='seznam' ? 'block' : 'none';
  document.getElementById('bottomBar-nakup').style.display = v==='nakup' ? 'flex' : 'none';
  document.getElementById('bottomBar-kosarica').style.display = v==='kosarica' ? 'flex' : 'none';
  document.getElementById('bottomBar-seznam').style.display = v==='seznam' ? 'flex' : 'none';
  document.getElementById('tab-nakup').className = 'tab' + (v==='nakup'?' active':'');
  document.getElementById('tab-kosarica').className = 'tab' + (v==='kosarica'?' active':'');
  document.getElementById('tab-seznam').className = 'tab' + (v==='seznam'?' active':'');
  if (v==='nakup') renderNakup();
  else if (v==='kosarica') renderKosarica();
  else renderSeznam();
}

function renderKosarica() {
  const container = document.getElementById('kosaricaList');
  const empty = document.getElementById('kosaricaEmpty');
  container.innerHTML = '';

  const checked = items.filter(i=>i.checked);
  if (!checked.length) { empty.style.display='block'; return; }
  empty.style.display='none';

  document.getElementById('headerStats').textContent = `${checked.length} v košarici`;

  CATEGORIES.forEach(cat => {
    const catItems = checked.filter(i=>i.cat===cat);
    if (!catItems.length) return;

    const sec = document.createElement('div');
    sec.className = 'cat-section';

    const hdr = document.createElement('div');
    hdr.className = 'cat-title';
    hdr.textContent = cat;
    sec.appendChild(hdr);

    catItems.forEach(item => {
      const globalIdx = items.indexOf(item);
      const card = document.createElement('div');
      card.className = 'item-card';
      const row = document.createElement('div');
      row.className = 'item-row checked';
      row.style.cssText = 'cursor:pointer;';
      row.innerHTML = `
        <div class="item-check" style="background:var(--accent);border-color:var(--accent);">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="item-name" style="text-decoration:none;color:var(--text);">${escHtml(item.name)}</div>
        <button onclick="event.stopPropagation();odznaciItem(${globalIdx})" style="border:none;background:transparent;color:var(--text3);font-size:18px;cursor:pointer;padding:0 4px;" aria-label="Odstrani iz košarice">×</button>
      `;
      row.onclick = () => { items[globalIdx].checked = false; save(); renderKosarica(); };
      card.appendChild(row);
      sec.appendChild(card);
    });

    container.appendChild(sec);
  });
}

function odznaciItem(idx) {
  items[idx].checked = false;
  save();
  renderKosarica();
}

function renderNakup() {
  const container = document.getElementById('nakupList');
  const empty = document.getElementById('nakupEmpty');
  container.innerHTML = '';

  if (items.length === 0) { empty.style.display='block'; return; }
  empty.style.display='none';

  const checked = items.filter(i=>i.checked).length;
  document.getElementById('headerStats').textContent = checked > 0 ? `${checked}/${items.length} v košarici` : `${items.length} artiklov`;

  CATEGORIES.forEach(cat => {
    const catItems = items.filter(i=>i.cat===cat);
    if (!catItems.length) return;

    const sec = document.createElement('div');
    sec.className = 'cat-section';

    const hdr = document.createElement('div');
    hdr.className = 'cat-title';
    hdr.textContent = cat;
    sec.appendChild(hdr);

    catItems.forEach(item => {
      const globalIdx = items.indexOf(item);
      const card = document.createElement('div');
      card.className = 'item-card';

      const row = document.createElement('div');
      row.className = 'item-row' + (item.checked ? ' checked' : '');
      row.innerHTML = `
        <div class="item-check">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="item-name">${escHtml(item.name)}</div>
      `;
      row.onclick = () => { items[globalIdx].checked = !items[globalIdx].checked; save(); renderNakup(); };
      card.appendChild(row);
      sec.appendChild(card);
    });

    container.appendChild(sec);
  });
}

function renderSeznam() {
  const container = document.getElementById('seznamList');
  const empty = document.getElementById('seznamEmpty');
  container.innerHTML = '';

  if (items.length === 0) { empty.style.display='block'; return; }
  empty.style.display='none';
  document.getElementById('headerStats').textContent = `${items.length} artiklov`;

  CATEGORIES.forEach(cat => {
    const catItems = items.map((item, idx) => ({item, idx})).filter(({item}) => item.cat===cat);
    if (!catItems.length) return;

    const sec = document.createElement('div');
    sec.className = 'seznam-cat';

    const hdr = document.createElement('div');
    hdr.className = 'seznam-cat-header';
    hdr.innerHTML = `<div class="seznam-cat-title">${cat}</div>`;
    sec.appendChild(hdr);

    catItems.forEach(({item, idx}) => {
      const row = document.createElement('div');
      row.className = 'seznam-item';
      row.innerHTML = `
        <div class="seznam-item-name">${escHtml(item.name)}</div>
        <button class="del-btn" onclick="deleteItem(${idx})" aria-label="Izbriši">×</button>
      `;
      sec.appendChild(row);
    });

    container.appendChild(sec);
  });
}

function addItem() {
  const inp = document.getElementById('newItemInput');
  const cat = document.getElementById('newItemCat').value;
  const name = inp.value.trim();
  if (!name) return;
  const exists = items.some(i => i.name.toLowerCase()===name.toLowerCase());
  if (exists) { showToast('Ta artikel že obstaja'); return; }
  items.push({name, cat, checked:false});
  inp.value = '';
  save();
  renderSeznam();
  showToast('Dodano: ' + name);
}

function deleteItem(idx) {
  const name = items[idx].name;
  items.splice(idx,1);
  save();
  renderSeznam();
  showToast('Odstranjeno: ' + name);
}

function odznaci() {
  items.forEach(i => i.checked=false);
  save();
  renderNakup();
  showToast('Kljukice počiščene');
}

function odstraniKupljene() {
  const n = items.filter(i=>i.checked).length;
  if (!n) { showToast('Ni označenih artiklov'); return; }
  items = items.filter(i=>!i.checked);
  save();
  renderNakup();
  showToast(`Odstranjeno: ${n} artiklov`);
}

function izbrisiVse() {
  if (!confirm('Res izbrisati vse artikle?')) return;
  items = [];
  save();
  renderSeznam();
  showToast('Seznam izbrisan');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

renderNakup();
</script>
</body>
</html>
